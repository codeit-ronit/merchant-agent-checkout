[project]
name = "sentinel"
version = "0.1.0"
description = "A policy enforcement, audit, and evaluation control plane for LLM agents that operate on payment infrastructure. Independent project; not affiliated with Razorpay."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pyyaml",
    "httpx",
    "pypdf",
    "python-multipart",
    "mcp",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "hypothesis", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "critical: the five load-bearing safety tests (see docs/spec/12-TESTING-AND-CI.md)",
    "tier1: pure unit tests, no model/network/IO",
    "tier2: property-based tests",
    "tier3: integration tests with fixture server, scripted agent, no model",
    "tier4: agent tests with a real model (or cassette replay); not run on every commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The policy package purity check is a dedicated test (tests/unit/test_policy_purity.py),
# not a ruff rule, because it needs import-graph reasoning.
select = ["E", "F", "I", "W"]
# E501 line length handled by formatter; E731 allows test lambdas.
ignore = ["E501", "E731"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]
