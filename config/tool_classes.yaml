# SENTINEL tool risk classification — reconciled against the upstream tools/list
# at startup. A tool present on the server but ABSENT here is UNKNOWN -> denied
# (fail closed). A tool here but absent from the server is STALE -> warn.
#
# Classified conservatively (docs/spec/07): if a tool could move funds, it is
# MONEY_MOVEMENT. Rationale for every money-movement classification is in
# DECISIONS.md (ADR-003). Money amounts are integer minor units (paise).
#
# Field paths in provenance_map / pii_map use: "field", "obj.field",
# "items[].field" (each element of a collection). Provenance defaults to
# TOOL_STRUCTURED (machine data, never instructions); free-text fields are
# UNTRUSTED and get quarantined by the proxy.

version: "1"
classified_on: "2026-08-21"

# Tools explicitly banned in this deployment: removed from the manifest entirely.
forbidden: []

# ---------------- Payments ----------------
tools:
  capture_payment:
    risk_class: MONEY_MOVEMENT
    moves_money: true
    binding_role: DISBURSEMENT
    amount_arg_path: amount
    currency_arg_path: currency
    entity_arg_paths: [payment_id]
  initiate_payment:
    risk_class: MONEY_MOVEMENT
    moves_money: true
    binding_role: DISBURSEMENT
    amount_arg_path: amount
    currency_arg_path: currency
    entity_arg_paths: [customer_id, order_id]
    counterparty_arg_path: customer_id      # novelty: charging a never-seen mandate/customer
    rehydratable_arg_paths: [token]
  submit_otp:
    risk_class: MONEY_MOVEMENT              # finalises the charge
    moves_money: true
    entity_arg_paths: [payment_id]
  resend_otp:
    risk_class: REVERSIBLE_WRITE            # sends an OTP to a real person (side effect)
    entity_arg_paths: [payment_id]
  fetch_payment:
    risk_class: READ
    entity_arg_paths: [payment_id]
    pii_map: {email: EMAIL, contact: PHONE, name: NAME, "card.last4": PAN_CARD, vpa: VPA}
    provenance_map: {description: UNTRUSTED, "notes.merchant_note": UNTRUSTED}
  fetch_payment_card_details:
    risk_class: READ
    entity_arg_paths: [payment_id]
    pii_map: {"card.last4": PAN_CARD}
  fetch_all_payments:
    risk_class: READ
    is_paginated: true
    pii_map: {"items[].email": EMAIL, "items[].contact": PHONE, "items[].name": NAME, "items[].card.last4": PAN_CARD, "items[].vpa": VPA}
    provenance_map: {"items[].description": UNTRUSTED, "items[].notes.merchant_note": UNTRUSTED}
  update_payment:
    risk_class: REVERSIBLE_WRITE
    entity_arg_paths: [payment_id]

  # ---------------- Payment links (real names from the live tools/list) ----------------
  create_payment_link:       {risk_class: REVERSIBLE_WRITE, binding_role: COLLECTION, amount_arg_path: amount, currency_arg_path: currency}
  payment_link_upi_create:   {risk_class: REVERSIBLE_WRITE, binding_role: COLLECTION, amount_arg_path: amount, currency_arg_path: currency}
  payment_link_notify:       {risk_class: REVERSIBLE_WRITE, entity_arg_paths: [payment_link_id]}
  update_payment_link:       {risk_class: REVERSIBLE_WRITE, entity_arg_paths: [payment_link_id]}
  fetch_payment_link:        {risk_class: READ, entity_arg_paths: [payment_link_id]}
  fetch_all_payment_links:   {risk_class: READ, is_paginated: true}

  # ---------------- Orders ----------------
  create_order:         {risk_class: REVERSIBLE_WRITE, binding_role: COLLECTION, amount_arg_path: amount, currency_arg_path: currency}
  update_order:         {risk_class: REVERSIBLE_WRITE, entity_arg_paths: [order_id]}
  fetch_order:          {risk_class: READ, entity_arg_paths: [order_id]}
  fetch_all_orders:     {risk_class: READ, is_paginated: true}
  fetch_order_payments:
    risk_class: READ
    entity_arg_paths: [order_id]
    is_paginated: true
    pii_map: {"items[].email": EMAIL, "items[].contact": PHONE}

  # ---------------- Refunds ----------------
  create_refund:
    risk_class: MONEY_MOVEMENT
    moves_money: true
    binding_role: DISBURSEMENT
    amount_arg_path: amount
    entity_arg_paths: [payment_id]
  fetch_refund:                        {risk_class: READ, entity_arg_paths: [refund_id]}
  fetch_all_refunds:                   {risk_class: READ, is_paginated: true}
  update_refund:                       {risk_class: REVERSIBLE_WRITE, entity_arg_paths: [refund_id]}
  fetch_multiple_refunds_for_payment:  {risk_class: READ, entity_arg_paths: [payment_id], is_paginated: true}
  fetch_specific_refund_for_payment:   {risk_class: READ, entity_arg_paths: [payment_id, refund_id]}

  # ---------------- QR codes (real arg name is qr_code_id, verified live) ----------------
  create_qr_code:                {risk_class: REVERSIBLE_WRITE, binding_role: COLLECTION, amount_arg_path: payment_amount}
  close_qr_code:                 {risk_class: IRREVERSIBLE_WRITE, entity_arg_paths: [qr_code_id]}
  fetch_qr_code:                 {risk_class: READ, entity_arg_paths: [qr_code_id]}
  fetch_all_qr_codes:            {risk_class: READ, is_paginated: true}
  fetch_qr_codes_by_customer_id: {risk_class: READ, entity_arg_paths: [customer_id]}
  fetch_qr_codes_by_payment_id:  {risk_class: READ, entity_arg_paths: [payment_id]}
  fetch_payments_for_qr_code:    {risk_class: READ, entity_arg_paths: [qr_code_id], is_paginated: true}

  # ---------------- Settlements ----------------
  fetch_all_settlements:         {risk_class: READ, is_paginated: true}
  fetch_settlement_with_id:      {risk_class: READ, entity_arg_paths: [settlement_id]}
  fetch_settlement_recon_details: {risk_class: READ, is_paginated: true}
  fetch_all_instant_settlements: {risk_class: READ, is_paginated: true}
  fetch_instant_settlement_with_id: {risk_class: READ, entity_arg_paths: [settlement_id]}
  create_instant_settlement:
    risk_class: MONEY_MOVEMENT
    moves_money: true
    binding_role: DISBURSEMENT
    amount_arg_path: amount

  # ---------------- Payouts (read-only upstream; real name fetch_payout_with_id) ----------------
  fetch_all_payouts:   {risk_class: READ, is_paginated: true, entity_arg_paths: [account_number]}
  fetch_payout_with_id: {risk_class: READ, entity_arg_paths: [payout_id]}

  # ---------------- Tokens ----------------
  fetch_tokens:  {risk_class: READ, entity_arg_paths: [contact], pii_map: {"items[].vpa": VPA}}  # real arg: contact

  # NOTE (verified via live tools/list, 2026-08-21): the published server exposes
  # NO revoke_token, create_registration_link, detect_stack, or
  # integrate_razorpay_checkout. They were transcription errors, now removed.

  # ---------------- Fixture extensions (not in upstream; parity reports them) ----------------
  fetch_dispute:
    risk_class: READ
    entity_arg_paths: [dispute_id]
    provenance_map: {customer_message: UNTRUSTED}
    pii_map: {"payment.email": EMAIL, "payment.contact": PHONE, "payment.name": NAME}
  fetch_all_disputes:
    risk_class: READ
    is_paginated: true
    provenance_map: {"items[].customer_message": UNTRUSTED}
  submit_dispute_evidence:
    risk_class: IRREVERSIBLE_WRITE          # once submitted to the network, cannot be unsent
    entity_arg_paths: [dispute_id]
  fetch_all_subscriptions:
    risk_class: READ
    is_paginated: true
  fetch_subscription:
    risk_class: READ
    entity_arg_paths: [subscription_id]

  # ---------------- CONDUIT catalog (MODELLED; served by ConduitUpstream, ADR-031) ----------------
  # Structured fields (ids, integer-minor-unit prices, stock) are TOOL_STRUCTURED —
  # trusted as data. Merchant-authored free text is UNTRUSTED and quarantined:
  # the attacker here is the counterparty (the merchant whose shop the agent buys from).
  # max_price_minor on catalog_search is a read-side filter — it binds nothing.
  catalog_search:
    risk_class: READ
    is_paginated: true
    provenance_map: {"items[].name": UNTRUSTED, "items[].description": UNTRUSTED, "items[].merchant_note": UNTRUSTED}
  catalog_get_item:
    risk_class: READ
    entity_arg_paths: [item_id]
    provenance_map: {name: UNTRUSTED, description: UNTRUSTED, merchant_note: UNTRUSTED}
  catalog_check_availability:
    risk_class: READ
    entity_arg_paths: [item_id]
  catalog_feed:
    risk_class: READ
    is_paginated: true
    provenance_map: {"items[].name": UNTRUSTED, "items[].description": UNTRUSTED, "items[].merchant_note": UNTRUSTED}

  # ---------------- CONDUIT cart (MODELLED; off-rail — ADR-032) ----------------
  # Mutations change state but bind nothing: REVERSIBLE_WRITE, BindingRole NONE —
  # exactly the distinction the binding-role model exists for. Line names in the
  # priced view are merchant-authored → UNTRUSTED.
  cart_create:      {risk_class: REVERSIBLE_WRITE, entity_arg_paths: [mandate_id], provenance_map: {"lines[].name": UNTRUSTED}}
  cart_add_item:    {risk_class: REVERSIBLE_WRITE, entity_arg_paths: [cart_id, item_id], provenance_map: {"lines[].name": UNTRUSTED}}
  cart_update_item: {risk_class: REVERSIBLE_WRITE, entity_arg_paths: [cart_id, item_id], provenance_map: {"lines[].name": UNTRUSTED}}
  cart_remove_item: {risk_class: REVERSIBLE_WRITE, entity_arg_paths: [cart_id, item_id], provenance_map: {"lines[].name": UNTRUSTED}}
  cart_view:        {risk_class: READ, entity_arg_paths: [cart_id], provenance_map: {"lines[].name": UNTRUSTED}}
  cart_clear:       {risk_class: REVERSIBLE_WRITE, entity_arg_paths: [cart_id], provenance_map: {"lines[].name": UNTRUSTED}}
  # The ONE binding step (ADR-027): reversible (an unpaid order is abandonable
  # intent-to-collect) but COLLECTION-binding, so it inherits the full collection
  # governance: per-call tiers, run aggregate, currency. expected_amount_minor is
  # the agent's stated BELIEF — the gate re-prices and rejects on divergence, so
  # execution only ever proceeds when it equals server truth.
  cart_commit:
    risk_class: REVERSIBLE_WRITE
    binding_role: COLLECTION
    amount_arg_path: expected_amount_minor
    currency_arg_path: currency
    entity_arg_paths: [cart_id]
    provenance_map: {"breakdown[].name": UNTRUSTED}
    # The gate's domain verdict (COMMITTED / REJECT_*) becomes the audit
    # entry's app_outcome — so "commits that produced no order" is a direct
    # ledger query, never an inference from downstream state (ADR-033).
    outcome_field: reason_code
