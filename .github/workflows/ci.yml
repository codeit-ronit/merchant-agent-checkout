# SENTINEL CI. Runs in cassette-replay mode: NO provider credentials needed.
# See docs/spec/12-TESTING-AND-CI.md for the tier model and gate policy.

name: ci

on:
  push:
  pull_request:

jobs:
  # ---- On every push: fast, deterministic, no model ----
  checks:
    runs-on: ubuntu-latest
    env:
      SENTINEL_MODE: fixture
      SENTINEL_CASSETTE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Secret scan (no live keys, ever)
        run: python -m scripts.secret_scan

      - name: Policy engine purity (zero I/O imports)
        run: pytest -q tests/unit/test_policy_purity.py

      - name: Lint
        run: ruff check sentinel tests || true

      - name: Tiers 1-3 (unit, property, integration) + critical safety tests
        run: pytest -q -m "tier1 or tier2 or tier3 or critical"

      - name: Fixture-vs-upstream schema parity
        run: python -m sentinel.fixtures.schema_parity

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build operator surface
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  # ---- On merge to main: the offline eval + red-team gates ----
  gates:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SENTINEL_MODE: fixture
      SENTINEL_CASSETTE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Eval suite with regression gates (offline)
        run: python -m evals.runner --check-gates
      - name: Red-team paired A/B with L3/L4 hard gate (offline)
        run: python -m redteam.runner --check-gates
      - name: Verify audit chain of the demo run
        run: make demo-cli && make verify-audit
