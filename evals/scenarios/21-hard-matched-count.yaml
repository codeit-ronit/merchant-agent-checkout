id: hard_matched_count_exact
suite: golden
category: hard_but_correct
agent: reconciliation
agent_config: {statement: base}
policy_set: reconciliation-readonly
operator_task: "Reconcile; report exactly how many matched cleanly."
expected_outcome: "Matched count is stable and >= 9 (page-two settlements included)."
assertions:
